    <script>
      // --- State Management ---
      const state = {
        elements: [],
        currentIndex: 0,
        isPlaying: false,
        voices: [],
        selectedVoiceName: '',
        rate: 1,
      };

      // --- DOM Elements ---
      const ui = {
        form: document.getElementById('fetchForm'),
        urlInput: document.getElementById('urlInput'),
        fetchBtn: document.getElementById('fetchBtn'),
        errorContainer: document.getElementById('errorContainer'),
        errorText: document.getElementById('errorText'),
        mainContent: document.getElementById('mainContent'),
        treeContainer: document.getElementById('treeContainer'),
        treeHeader: document.getElementById('treeHeader'),
        prevBtn: document.getElementById('prevBtn'),
        playPauseBtn: document.getElementById('playPauseBtn'),
        stopBtn: document.getElementById('stopBtn'),
        nextBtn: document.getElementById('nextBtn'),
        playIcon: document.getElementById('playIcon'),
        pauseIcon: document.getElementById('pauseIcon'),
        progressText: document.getElementById('progressText'),
        voiceSelect: document.getElementById('voiceSelect'),
        rateInput: document.getElementById('rateInput'),
        rateLabel: document.getElementById('rateLabel'),
      };

      // --- Voice Initialization ---
      function loadVoices() {
        state.voices = window.speechSynthesis.getVoices();
        ui.voiceSelect.innerHTML = '';

        if (state.voices.length > 0) {
          const defaultVoice = state.voices.find((v) => v.lang.includes('en-')) || state.voices[0];
          state.selectedVoiceName = defaultVoice.name;

          state.voices.forEach((voice) => {
            const option = document.createElement('option');
            option.value = voice.name;
            option.textContent = `${voice.name} (${voice.lang})`;
            if (voice.name === defaultVoice.name) option.selected = true;
            ui.voiceSelect.appendChild(option);
          });
        }
      }

      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();

      // --- Core Parsing Logic ---
      function traverseDOM(node, results, activeIds = []) {
        let currentIds = [...activeIds];

        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.id) currentIds.push(node.id);

          const tag = node.tagName.toLowerCase();

          if (['script', 'style', 'noscript', 'iframe', 'svg', 'canvas'].includes(tag)) return;
          if (node.getAttribute('aria-hidden') === 'true') return;

          const styleStr = node.getAttribute('style') || '';
          if (styleStr.includes('display: none') || styleStr.includes('visibility: hidden')) return;

          const ariaLabel = node.getAttribute('aria-label');
          const alt = node.getAttribute('alt');
          const role = node.getAttribute('role');
          const href = node.getAttribute('href');

          let spokenText = '';
          let displayType = tag.toUpperCase();
          let targetHash = null;

          if (tag === 'img') {
            spokenText = alt ? `Image. ${alt}` : 'Unlabeled image';
            displayType = 'IMAGE';
          } else if (tag.match(/^h[1-6]$/)) {
            spokenText = `Heading level ${tag[1]}. ${node.textContent.trim()}`;
            displayType = `HEADING ${tag[1]}`;
          } else if (tag === 'a' || role === 'link') {
            spokenText = `Link. ${node.textContent.trim()}`;
            displayType = 'LINK';
            if (href && href.startsWith('#') && href.length > 1) {
              targetHash = href;
            }
          } else if (tag === 'button' || role === 'button') {
            spokenText = `Button. ${node.textContent.trim()}`;
            displayType = 'BUTTON';
          } else if (tag === 'nav' || role === 'navigation') {
            results.push({ spokenText: 'Navigation region', type: 'REGION', ids: currentIds });
          } else if (ariaLabel) {
            spokenText = `${ariaLabel}. ${role || tag}`;
            displayType = `ARIA: ${role || tag}`;
          }

          if (spokenText && spokenText.trim().length > 0) {
            results.push({ spokenText, type: displayType, ids: currentIds, hash: targetHash });
            return;
          }
        }

        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent.trim();
          if (text.length > 1) {
            results.push({ spokenText: text, type: 'TEXT', ids: currentIds });
          }
          return;
        }

        if (node.childNodes) {
          node.childNodes.forEach((child) => traverseDOM(child, results, currentIds));
        }
      }

      // --- CORS Proxy with fallback chain ---
      async function fetchViaProxy(url) {
        const proxies = [
          async () => {
            const r = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
            if (!r.ok) throw new Error(`corsproxy.io returned ${r.status}`);
            return await r.text();
          },
          async () => {
            const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            if (!r.ok) throw new Error(`allorigins returned ${r.status}`);
            const data = await r.json();
            if (!data.contents) throw new Error('allorigins returned empty content');
            return data.contents;
          },
          async () => {
            const r = await fetch(
              `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            );
            if (!r.ok) throw new Error(`codetabs returned ${r.status}`);
            return await r.text();
          },
        ];

        let lastError;
        for (const proxy of proxies) {
          try {
            return await proxy();
          } catch (err) {
            lastError = err;
          }
        }
        throw new Error(
          `All proxy services failed (${lastError.message}). Try a different URL or check your connection.`
        );
      }

      // --- Fetch & Build UI ---
      ui.form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const url = ui.urlInput.value;
        if (!url) return;

        ui.fetchBtn.textContent = 'Scanning...';
        ui.fetchBtn.disabled = true;
        ui.errorContainer.classList.add('hidden');
        stopPlayback();
        state.elements = [];

        try {
          const html = await fetchViaProxy(url);

          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          traverseDOM(doc.body, state.elements);

          if (state.elements.length === 0) {
            throw new Error(
              'Could not parse any readable text from this page. It might be a blank page or rely entirely on client-side Javascript.'
            );
          }

          renderTree();
          ui.mainContent.classList.remove('hidden');
        } catch (err) {
          ui.errorText.textContent = `Failed to load page: ${err.message}`;
          ui.errorContainer.classList.remove('hidden');
          ui.mainContent.classList.add('hidden');
        } finally {
          ui.fetchBtn.textContent = 'Fetch & Analyze';
          ui.fetchBtn.disabled = false;
        }
      });

      // --- Handle Jumping for Skip Links ---
      window.handleJumpLink = function (event, hash) {
        event.stopPropagation();

        const targetId = hash.substring(1);
        const targetIndex = state.elements.findIndex((el) => el.ids && el.ids.includes(targetId));

        if (targetIndex !== -1) {
          jumpToItem(targetIndex);

          setTimeout(() => {
            const items = document.querySelectorAll('.tree-item');
            if (items[targetIndex]) {
              items[targetIndex].classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2');
              setTimeout(() => {
                items[targetIndex].classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2');
              }, 1000);
            }
          }, 100);
        } else {
          alert(`Could not find the target destination (id="${targetId}") on this page.`);
        }
      };

      // --- Render Accessibility Tree ---
      function renderTree() {
        ui.treeContainer.innerHTML = '';
        ui.treeHeader.textContent = `Accessibility Tree (${state.elements.length} nodes)`;

        state.elements.forEach((el, idx) => {
          const div = document.createElement('div');
          div.className =
            'tree-item p-3 rounded-lg border cursor-pointer transition-all border-slate-100 hover:border-slate-300 hover:bg-slate-50';
          div.onclick = () => jumpToItem(idx);

          let badgeClass = 'bg-slate-100 text-slate-600';
          if (el.type.includes('HEADING')) badgeClass = 'bg-purple-100 text-purple-700';
          else if (el.type === 'LINK') badgeClass = 'bg-blue-100 text-blue-700';
          else if (el.type === 'BUTTON') badgeClass = 'bg-orange-100 text-orange-700';
          else if (el.type === 'IMAGE') badgeClass = 'bg-green-100 text-green-700';

          let jumpButtonHtml = '';
          if (el.hash) {
            jumpButtonHtml = `
              <div class="mt-2 pl-8">
                <button onclick="handleJumpLink(event, '${el.hash}')" class="text-xs font-semibold bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded inline-flex items-center gap-1 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                  Activate Skip Link (Jump to ${el.hash})
                </button>
              </div>
            `;
          }

          div.innerHTML = `
            <div class="flex flex-col">
              <div class="flex items-start gap-3">
                <span class="text-xs font-bold px-2 py-1 rounded mt-0.5 whitespace-nowrap ${badgeClass}">${el.type}</span>
                <p class="text-sm text-slate-600" style="margin: 0; font-size: 0.875rem;">${el.spokenText}</p>
              </div>
              ${jumpButtonHtml}
            </div>
          `;
          ui.treeContainer.appendChild(div);
        });
        updateUI();
      }

      // --- Playback Logic ---
      function playCurrent() {
        window.speechSynthesis.cancel();

        if (!state.isPlaying || state.currentIndex >= state.elements.length) {
          state.isPlaying = false;
          updateUI();
          return;
        }

        const element = state.elements[state.currentIndex];
        const utterance = new SpeechSynthesisUtterance(element.spokenText);

        utterance.rate = state.rate;
        if (state.selectedVoiceName) {
          const voice = state.voices.find((v) => v.name === state.selectedVoiceName);
          if (voice) utterance.voice = voice;
        }

        utterance.onend = () => {
          if (state.isPlaying) {
            state.currentIndex++;
            updateUI();
            playCurrent();
          }
        };

        utterance.onerror = (e) => {
          if (e.error !== 'interrupted') {
            console.error('Speech Synthesis Error:', e);
            state.isPlaying = false;
            updateUI();
          }
        };

        window.speechSynthesis.speak(utterance);
      }

      function togglePlayPause() {
        state.isPlaying = !state.isPlaying;
        if (state.isPlaying) {
          if (state.currentIndex >= state.elements.length) state.currentIndex = 0;
          updateUI();
          playCurrent();
        } else {
          window.speechSynthesis.cancel();
          updateUI();
        }
      }

      function stopPlayback() {
        state.isPlaying = false;
        state.currentIndex = 0;
        window.speechSynthesis.cancel();
        updateUI();
      }

      function jumpToItem(index) {
        state.currentIndex = index;
        state.isPlaying = true;
        updateUI();
        playCurrent();
      }

      // --- UI Updaters ---
      function updateUI() {
        if (state.isPlaying) {
          ui.playIcon.classList.add('hidden');
          ui.pauseIcon.classList.remove('hidden');
        } else {
          ui.playIcon.classList.remove('hidden');
          ui.pauseIcon.classList.add('hidden');
        }

        if (state.elements.length > 0) {
          ui.progressText.textContent = `Reading item ${state.currentIndex + 1} of ${state.elements.length}`;
        }

        const items = document.querySelectorAll('.tree-item');
        items.forEach((item, idx) => {
          const textElement = item.querySelector('p');
          if (idx === state.currentIndex) {
            item.classList.add('border-blue-500', 'bg-blue-50', 'shadow-sm');
            item.classList.remove('border-slate-100');
            if (textElement) {
              textElement.classList.add('text-slate-900', 'font-medium');
              textElement.classList.remove('text-slate-600');
            }
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            item.classList.remove('border-blue-500', 'bg-blue-50', 'shadow-sm');
            item.classList.add('border-slate-100');
            if (textElement) {
              textElement.classList.remove('text-slate-900', 'font-medium');
              textElement.classList.add('text-slate-600');
            }
          }
        });
      }

      // --- Event Listeners ---
      ui.playPauseBtn.addEventListener('click', togglePlayPause);
      ui.stopBtn.addEventListener('click', stopPlayback);

      ui.nextBtn.addEventListener('click', () => {
        state.currentIndex = Math.min(state.currentIndex + 1, state.elements.length - 1);
        if (state.isPlaying) playCurrent();
        updateUI();
      });

      ui.prevBtn.addEventListener('click', () => {
        state.currentIndex = Math.max(state.currentIndex - 1, 0);
        if (state.isPlaying) playCurrent();
        updateUI();
      });

      ui.voiceSelect.addEventListener('change', (e) => {
        state.selectedVoiceName = e.target.value;
      });

      ui.rateInput.addEventListener('input', (e) => {
        state.rate = parseFloat(e.target.value);
        ui.rateLabel.textContent = `${state.rate}x`;
      });

      window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
      });
    </script>
  </body>
</html>
