    <style>
      :root {
        --teal: #1bb1a5;
        --primary-teal: #2b8a92;
        --dark-teal: #146068;
        --accent-lime: #bfff00;
        --accent-orange: #f97316;
        --dark-gray: #333333;
        --mid-gray: #666666;
        --light-gray: #f5f5f5;
        --white: #ffffff;
        --text-dark: #111111;
        --border: 1px solid var(--text-dark);
        --yellow: #f6b352;
      }

      body {
        background-color: #fff;
      }

      /* ─── HERO ─────────────────────────────────────────── */
      .hero-title-block {
        width: 100%;
        padding: 7vw 4vw 5vw;
        background: #fff;
      }
      .hero-title-block h1 {
        font-size: clamp(2.5rem, 8vw, 8rem);
        line-height: 0.85;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.04em;
        margin-bottom: 2rem;
        max-width: 12ch;
      }
      .hero-title-block .subtitle {
        font-size: clamp(1rem, 1.8vw, 1.4rem);
        font-weight: 500;
        line-height: 1.5;
        max-width: 900px;
        color: var(--text-dark);
      }

      /* ─── BAUHAUS GRID ─────────────────────────────────── */
      .portfolio-section {
        padding: 0 4vw 4vw 4vw;
        background-color: #fff;
        display: flex;
        justify-content: center;
      }
      .bauhaus-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-auto-rows: auto;
        width: 100%;
        max-width: 1400px;
        border-left: var(--border);
        border-top: 1px solid #000;
        background: #fff;
      }
      .b-tile {
        container-type: inline-size;
        border-right: var(--border);
        border-bottom: var(--border);
        padding: 2.5rem;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
        min-height: 240px;
      }

      /* Grid Spans */
      .span-col-1 {
        grid-column: span 2;
      }
      .span-col-2 {
        grid-column: span 4;
      }
      .span-col-3 {
        grid-column: span 6;
      }
      .span-col-4 {
        grid-column: span 8;
      }
      .span-row-2 {
        grid-row: span 2;
      }

      /* Form Styles */
      .form-status {
        margin-top: 1rem;
        font-size: 0.9rem;
        font-weight: 700;
        line-height: 1.4;
        min-height: 1.2em;
      }
      .form-status.is-error {
        color: #b3261e;
      }
      .form-status.is-ok {
        color: var(--dark-teal);
      }

      .contact-form {
        width: 100%;
      }
      .form-group {
        margin-bottom: 2.5rem;
        border-bottom: 2px solid rgba(0, 0, 0, 0.15);
        padding-bottom: 0.5rem;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.6;
        margin-bottom: 0.75rem;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        background: transparent;
        border: none;
        font-size: 1.5rem;
        font-family: inherit;
        font-weight: 600;
        outline: none !important;
        padding: 0.75rem 0;
        color: var(--text-dark);
      }
      .submit-btn {
        background: var(--text-dark);
        color: #fff;
        border: none;
        padding: 1.2rem 2.5rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: all 0.3s ease;
        align-self: flex-start;
        margin-top: 1rem;
      }
      .submit-btn:hover {
        background: var(--teal);
        transform: translateY(-3px);
      }

      /* Testimonial Bauhaus Logic */
      .testimonial-card {
        transition:
          background-color 0.1s steps(1),
          color 0.1s steps(1);
        min-height: 300px;
      }
      .quote-icon {
        width: 60px;
        height: 60px;
        background-color: var(--quote-color, var(--accent-orange));
        mask-image: url("data:image/svg+xml,%3Csvg width='265' height='266' viewBox='0 0 265 266' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M82.8125 66.5C55.4779 66.5 33.125 88.9373 33.125 116.375V199.5H115.938V116.375H49.6875C49.6875 97.9316 64.4385 83.125 82.8125 83.125V66.5ZM198.75 66.5C171.415 66.5 149.062 88.9373 149.062 116.375V199.5H231.875V116.375H165.625C165.625 97.9316 180.376 83.125 198.75 83.125V66.5ZM49.6875 133H99.375V182.875H49.6875V133ZM165.625 133H215.312V182.875H165.625V133Z' fill='%23FF7500'/%3E%3C/svg%3E");
        -webkit-mask-image: url("data:image/svg+xml,%3Csvg width='265' height='266' viewBox='0 0 265 266' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M82.8125 66.5C55.4779 66.5 33.125 88.9373 33.125 116.375V199.5H115.938V116.375H49.6875C49.6875 97.9316 64.4385 83.125 82.8125 83.125V66.5ZM198.75 66.5C171.415 66.5 149.062 88.9373 149.062 116.375V199.5H231.875V116.375H165.625C165.625 97.9316 180.376 83.125 198.75 83.125V66.5ZM49.6875 133H99.375V182.875H49.6875V133ZM165.625 133H215.312V182.875H165.625V133Z' fill='%23FF7500'/%3E%3C/svg%3E");
        mask-size: contain;
        -webkit-mask-size: contain;
        mask-repeat: no-repeat;
        -webkit-mask-repeat: no-repeat;
        transition: background-color 0.1s steps(1);
        position: absolute;
      }
      .quote-icon.top {
        top: 1.5rem;
        left: 1.5rem;
      }
      .quote-icon.bottom {
        bottom: 1.5rem;
        right: 1.5rem;
        transform: rotate(180deg);
      }

      .quote-content {
        padding: 3rem 1.5rem;
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .quote-text {
        font-size: 1.2rem;
        line-height: 1.4;
        font-weight: 700;
        margin-bottom: 2rem;
        font-style: italic;
      }
      .quote-author {
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.8;
      }
      .quote-author::before {
        content: '';
      }

      @media (max-width: 1100px) {
        .bauhaus-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .span-col-1,
        .span-col-2,
        .span-col-3,
        .span-col-4 {
          grid-column: span 2;
        }
      }
      @media (max-width: 768px) {
        .bauhaus-grid {
          grid-template-columns: 1fr;
        }
        .span-col-1,
        .span-col-2,
        .span-col-3,
        .span-col-4 {
          grid-column: span 1;
        }
        .span-row-2 {
          grid-row: span 1;
        }
      }
    </style>

        { text: 'Heather, You do awesome work!', author: 'A.P.' },
        { text: 'You are \'rock solid\' team player who gets it done.', author: 'S.G.' },
        {
          text: 'Hope you have the best of success because I think you\'re super talented.',
          author: 'F.S.',
        },
      ];

      const themes = [
        { bg: '#136368', text: '#FFFFFF', quote: '#B2FF00' }, // Dark Teal + Lime
        { bg: '#666666', text: '#FFFFFF', quote: '#B2FF00' }, // Soft Black + Lime
        { bg: '#5E5E5E', text: '#FFFFFF', quote: '#B2FF00' }, // Medium Grey + Lime
        { bg: '#F4F4F4', text: '#111111', quote: '#FF6B00' }, // Light Grey + Orange
        { bg: '#0D9488', text: '#FFFFFF', quote: '#FFC837' }, // Bright Teal + Yellow
        { bg: '#FF6B00', text: '#111111', quote: '#F4F4F4' }, // Orange + Light Grey
        { bg: '#FFC837', text: '#111111', quote: '#136368' }, // Yellow + Teal
        { bg: '#B2FF00', text: '#111111', quote: '#5E5E5E' }, // Lime + Grey
      ];

      const insertionPoint = document.getElementById('testimonials-insertion-point');
      const cards = [];

      function initGrid() {
        let currentOccupancy = 0;
        testimonials.forEach((testimonial, index) => {
          const initialTheme = themes[index % themes.length];
          const card = document.createElement('div');

          const isLong = testimonial.text.length > 80;
          let units = isLong ? 4 : 2;

          // Logic: If we only have 2 units left in the row but this is a long one (4),
          // we force it to be short (2) to keep the grid even and border-locked.
          const remainingInRow = 8 - (currentOccupancy % 8);
          if (remainingInRow === 2 && units === 4) {
            units = 2;
          }

          const spanClass = `span-col-${units / 2}`;
          card.className = `b-tile testimonial-card ${spanClass}`;
          card.dataset.themeIndex = index % themes.length;
          card.dataset.units = units;

          card.style.backgroundColor = initialTheme.bg;
          card.style.color = initialTheme.text;
          card.style.setProperty('--quote-color', initialTheme.quote);

          card.innerHTML = `
            <div class="quote-icon top"></div>
            <div class="quote-content">
              <div class="quote-text">${testimonial.text}</div>
              <div class="quote-author">${testimonial.author}</div>
            </div>
            <div class="quote-icon bottom"></div>
          `;

          insertionPoint.appendChild(card);
          cards.push(card);
          currentOccupancy += units;
        });

        // Final Row Cleanup: Fill any remaining 2, 4, or 6 unit gaps
        const finalRemainder = currentOccupancy % 8;
        if (finalRemainder !== 0) {
          const lastCard = cards[cards.length - 1];
          const gap = 8 - finalRemainder;
          const currentUnits = parseInt(lastCard.dataset.units);
          const newUnits = currentUnits + gap;

          lastCard.classList.remove(`span-col-${currentUnits / 2}`);
          lastCard.classList.add(`span-col-${newUnits / 2}`);
        }
      }

      function animateColors() {
        const count = 1; // Swap 1 at a time
        for (let i = 0; i < count; i++) {
          const card = cards[Math.floor(Math.random() * cards.length)];
          let currentThemeIndex = parseInt(card.dataset.themeIndex);
          let newThemeIndex = Math.floor(Math.random() * themes.length);
          while (newThemeIndex === currentThemeIndex) {
            newThemeIndex = Math.floor(Math.random() * themes.length);
          }
          const newTheme = themes[newThemeIndex];
          card.style.backgroundColor = newTheme.bg;
          card.style.color = newTheme.text;
          card.style.setProperty('--quote-color', newTheme.quote);
          card.dataset.themeIndex = newThemeIndex;
        }
      }

      initGrid();
      setInterval(animateColors, 6000);
    </script>
    <script>
      // Submit the contact form without leaving the page. The form keeps its
      // action and method, so a plain POST still works if this never runs.
      (function () {
        const form = document.getElementById('contact-form');
        if (!form) return;
        const status = document.getElementById('contact-status');
        const button = form.querySelector('.submit-btn');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          status.className = 'form-status';
          status.textContent = 'Sending...';
          button.disabled = true;

          try {
            const res = await fetch(form.action, {
              method: 'POST',
              body: new FormData(form),
              headers: { Accept: 'application/json' },
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.success) {
              status.className = 'form-status is-ok';
              status.textContent = data.message || 'Message sent. I\'ll be in touch soon.';
              form.reset();
            } else {
              status.className = 'form-status is-error';
              status.textContent =
                data.message || 'Something went wrong. Email contact@heathernew.com directly.';
            }
          } catch {
            status.className = 'form-status is-error';
            status.textContent =
              'Could not reach the server. Email contact@heathernew.com directly.';
          } finally {
            button.disabled = false;
          }
        });
      })();
    </script>
