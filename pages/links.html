    <style>
      :root {
        --teal: #1bb1a5;
        --primary-teal: #2b8a92;
        --lime: #bfff00;
        --dark: #111111;
        --mid-gray: #666666;
        --light-gray: #f0f0f0;
        --border: #e0e0e0;
        --white: #ffffff;
      }

      #links-page {
        background: #f7f8f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.25rem 4rem;
        min-height: 60vh;
      }

      /* ── Profile ──────────────────────────────── */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
        text-align: center;
      }

      .avatar-ring {
        width: 108px;
        height: 108px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--teal), var(--lime));
        flex-shrink: 0;
      }

      .avatar-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: var(--light-gray);
      }

      .wordmark {
        height: 28px;
        width: auto;
      }

      .role {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--mid-gray);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .email-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--primary-teal);
        text-decoration: none;
        padding: 0.35rem 0.75rem;
        border: 1.5px solid var(--teal);
        border-radius: 100px;
        transition:
          background 0.18s,
          color 0.18s;
      }

      .email-link:hover {
        background: var(--teal);
        color: var(--white);
      }

      .email-link svg {
        flex-shrink: 0;
      }

      /* ── Link Cards ───────────────────────────── */
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 420px;
      }

      .link-card {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: var(--white);
        border: 1.5px solid var(--border);
        border-left: 4px solid var(--primary-teal);
        border-radius: 10px;
        text-decoration: none;
        color: var(--dark);
        font-weight: 700;
        font-size: 0.95rem;
        transition:
          border-color 0.18s,
          background 0.18s,
          transform 0.15s;
        position: relative;
        overflow: hidden;
      }

      .link-card:hover {
        border-color: var(--teal);
        border-left-color: var(--lime);
        background: #f0ffcc;
        transform: translateX(3px);
      }

      .link-card--accent {
        border-left-color: var(--lime);
      }

      .link-card--accent:hover {
        background: #edfff5;
        border-color: var(--teal);
      }

      .link-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--light-gray);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .link-icon svg {
        width: 20px;
        height: 20px;
        color: var(--primary-teal);
      }

      .link-text {
        flex: 1;
        line-height: 1.3;
      }

      .link-label {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mid-gray);
        margin-bottom: 0.15rem;
      }

      .link-title {
        display: block;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--dark);
      }

      .link-arrow {
        flex-shrink: 0;
        color: var(--primary-teal);
        transition: transform 0.15s;
      }

      .link-card:hover .link-arrow {
        transform: translateX(4px);
      }

      @media (max-width: 480px) {
        #links-page {
          padding: 2rem 1rem 3rem;
        }
      }
