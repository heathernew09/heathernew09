<div id="tree-partial-container">
    <div id="tree-screen-wrapper">
        <img id="tree-decorative-frame" src="/assets/tree/frame.png" alt="Decorative Wood Frame" />

        <iframe 
            id="tree-iframe"
            title="Interactive Decision Tree"
            scrolling="no"
            src="https://decisiontree.builtmerge.com/" 
        ></iframe>
    </div>

    <div class="tree-cta-block">
        <h3>Explore the Decision Tree</h3>
        <p>Interact with the artwork above. Navigate through the branches to uncover the path forward.</p>
        <a href="/pages/decision-tree.html" class="btn-tree-link">View Full Project</a>
    </div>
</div>

<script>
(function() {
    "use strict";

    function initDecisionTree() {
        const container = document.getElementById('tree-partial-container');
        if (!container || container.dataset.initialized === "true") return;
        
        container.dataset.initialized = "true";
        console.log("✅ Decision Tree: Partial Initialized");
    }

    // --- SECTION MANAGER INTEGRATION ---
    function activateTree() {
        // You could use postMessage here to tell the iframe to "start"
        console.log("Tree Hero: Active");
    }

    function deactivateTree() {
        console.log("Tree Hero: Paused");
    }

    // Handshake with include.js
    document.addEventListener('partialLoaded', (e) => {
        if (e.detail.id === 'hero-decisiontree.html') {
            initDecisionTree();
            
            // Register this section with the Global SectionManager
            // Matches the ID on your home page: <section id="decision-tree">
            if (window.sectionManager) {
                window.sectionManager.register('decision-tree', activateTree, deactivateTree);
            }
        }
    });

    // Fallback if the partial is already in the DOM
    if (document.getElementById('tree-partial-container')) initDecisionTree();
})();
</script>
