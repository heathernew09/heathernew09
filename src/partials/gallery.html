<!-- PhotoSwipe markup -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="pswp__bg"></div>
  <div class="pswp__scroll-wrap">
    <div class="pswp__container">
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
    </div>
    <div class="pswp__ui pswp__ui--hidden">
      <div class="pswp__top-bar">
        <div class="pswp__counter"></div>
        <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
        <button class="pswp__button pswp__button--share" title="Share"></button>
        <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
        <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
        <div class="pswp__preloader">
          <div class="pswp__preloader__icn">
            <div class="pswp__preloader__cut">
              <div class="pswp__preloader__donut"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
        <div class="pswp__share-tooltip"></div>
      </div>
      <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
      <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>
      <div class="pswp__caption">
        <div class="pswp__caption__center"></div>
      </div>
    </div>
  </div>
</div>

<!-- Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lazysizes/4.0.2/lazysizes.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.2/photoswipe.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.2/photoswipe-ui-default.js"></script>

<script>
  // Initialize PhotoSwipe
  function initPhotoSwipe(gallerySelector) {
    const galleries = document.querySelectorAll(gallerySelector);

    galleries.forEach((gallery, galleryIndex) => {
      // Add unique ID to gallery
      gallery.setAttribute('data-pswp-uid', galleryIndex + 1);

      // Click handler
      gallery.addEventListener('click', (e) => {
        e.preventDefault();

        // Find the clicked figure element
        let target = e.target;
        let clickedFigure = null;

        // Traverse up to find the figure element
        while (target && target !== gallery) {
          if (target.tagName === 'FIGURE') {
            clickedFigure = target;
            break;
          }
          target = target.parentNode;
        }

        if (!clickedFigure) return;

        // Find index of clicked item
        const figures = Array.from(gallery.querySelectorAll('figure'));
        const index = figures.indexOf(clickedFigure);

        if (index >= 0) {
          openPhotoSwipe(index, gallery);
        }
      });
    });

    // Check URL hash on load
    const hashData = parseHash();
    if (hashData.pid && hashData.gid) {
      openPhotoSwipe(hashData.pid - 1, galleries[hashData.gid - 1], true, true);
    }
  }

  function openPhotoSwipe(index, galleryElement, disableAnimation, fromURL) {
    const pswpElement = document.querySelector('.pswp');
    const items = parseGalleryItems(galleryElement);

    const options = {
      index: index,
      galleryUID: galleryElement.getAttribute('data-pswp-uid'),

      getThumbBoundsFn: (index) => {
        const thumbnail = items[index].el.querySelector('img');
        const pageYScroll = window.pageYOffset || document.documentElement.scrollTop;
        const rect = thumbnail.getBoundingClientRect();

        return {
          x: rect.left,
          y: rect.top + pageYScroll,
          w: rect.width,
        };
      },
    };

    if (disableAnimation) {
      options.showAnimationDuration = 0;
    }

    // Initialize PhotoSwipe
    const gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, options);

    // Cleanup ghosting issues on close
    gallery.listen('destroy', () => {
      pswpElement.style.display = 'none';
      // Force removal of zoom-wrap artifacts
      const zoomWrap = pswpElement.querySelector('.pswp__zoom-wrap');
      if (zoomWrap) zoomWrap.innerHTML = '';
    });

    gallery.listen('initialZoomIn', () => {
      pswpElement.style.display = 'block';
    });

    gallery.init();
    return gallery;
  }

  function parseGalleryItems(galleryElement) {
    const figures = galleryElement.querySelectorAll('figure');
    const items = [];

    figures.forEach((figure) => {
      const link = figure.querySelector('a');
      const size = link.getAttribute('data-size').split('x');
      const caption = figure.querySelector('figcaption');

      const item = {
        src: link.getAttribute('href'),
        w: parseInt(size[0], 10),
        h: parseInt(size[1], 10),
        el: figure,
      };

      if (caption && caption.textContent.trim() !== 'Caption') {
        item.title = caption.innerHTML;
      }

      const img = link.querySelector('img');
      if (img) {
        item.msrc = img.getAttribute('data-src') || img.getAttribute('src');
      }

      items.push(item);
    });

    return items;
  }

  function parseHash() {
    const hash = window.location.hash.substring(1);
    const params = {};

    if (hash.length < 5) return params;

    const vars = hash.split('&');
    vars.forEach((varStr) => {
      if (!varStr) return;
      const pair = varStr.split('=');
      if (pair.length < 2) return;
      params[pair[0]] = pair[1];
    });

    if (params.gid) {
      params.gid = parseInt(params.gid, 10);
    }
    if (params.pid) {
      params.pid = parseInt(params.pid, 10);
    }

    return params;
  }

  // Initialize on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initPhotoSwipe('.gallery');
    });
  } else {
    initPhotoSwipe('.gallery');
  }
</script>
