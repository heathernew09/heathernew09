  <body id="derby-404-body" class="page-template">
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <header class="site-header">
      <div class="header-content"><load src="./src/partials/nav.html" /></div>
    </header>

    <main id="main-content">
      <div id="tile-404-container" class="derby-container">
        <span class="header-404">Error 404</span>
        <h1>Off The Track!</h1>
        <p class="subtitle">
          Looks like you got hip-checked into the bleachers. The page you want is missing, but
          before you get back out there, let's find your ultimate Derby Name.
        </p>

        <div id="tile-404-inputs" class="input-grid">
          <div class="form-group">
            <label for="userName">Your First Name</label>
            <input type="text" id="userName" placeholder="e.g. Sarah, Alex..." />
          </div>
          <div class="form-group">
            <label for="userInterest">A Favorite Thing</label>
            <input type="text" id="userInterest" placeholder="e.g. Tacos, Space, Metal..." />
          </div>
        </div>

        <button id="tile-404-generate-btn" class="btn-derby" onclick="generateNewName()">
          Generate Derby Name ⚡
        </button>

        <div id="resultArea" class="result-area">
          <div class="instruction">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
                fill="currentColor"
              />
            </svg>
            Smash any word below to reroll it!
          </div>

          <div class="name-display" id="nameDisplay">
            <!-- Word parts will be injected here via JS -->
          </div>

          <div class="action-buttons">
            <button class="btn-outline-derby" onclick="copyName()" id="copyBtn">Copy Text</button>
            <button class="btn-outline-derby btn-export" onclick="exportVIPPass()" id="exportBtn">
              ⬇ Export MVP Medal
            </button>
          </div>

          <div id="tile-404-history" class="derby-history">
            <h5>Recent Hits</h5>
            <div id="chatFeed" class="chat-feed">
              <!-- History injected here -->
            </div>
          </div>
        </div>

        <a id="tile-404-back-link" href="/" class="home-link">← Back to the track</a>
      </div>

      <!-- Hidden SVG template for the MVP medal export -->
      <div id="svg-container">
        <svg
          id="vip-badge-svg"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 0 400 620"
          width="400"
          height="620"
          style="font-family: 'Manrope', 'Arial Black', Impact, sans-serif"
        >
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff6d5" />
              <stop offset="25%" stop-color="#ffe98a" />
              <stop offset="55%" stop-color="#e8b923" />
              <stop offset="80%" stop-color="#c9971b" />
              <stop offset="100%" stop-color="#9c7415" />
            </linearGradient>
            <radialGradient id="starGrad" cx="35%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#e8c250" />
              <stop offset="60%" stop-color="#c9971b" />
              <stop offset="100%" stop-color="#9c7415" />
            </radialGradient>
            <linearGradient id="ribbonStripes" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c81d25" />
              <stop offset="33%" stop-color="#c81d25" />
              <stop offset="33%" stop-color="#ffffff" />
              <stop offset="66%" stop-color="#ffffff" />
              <stop offset="66%" stop-color="#1c3f94" />
              <stop offset="100%" stop-color="#1c3f94" />
            </linearGradient>
            <filter id="medalShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow
                dx="0"
                dy="8"
                stdDeviation="9"
                flood-color="#000000"
                flood-opacity="0.35"
              />
            </filter>
            <path
              id="starShape"
              d="M0,-100 L22.45,-30.9 L95.11,-30.9 L36.33,11.8 L58.78,80.9 L0,38.2 L-58.78,80.9 L-36.33,11.8 L-95.11,-30.9 L-22.45,-30.9 Z"
            />
          </defs>

          <g filter="url(#medalShadow)">
            <!-- Ribbon -->
            <path d="M160,0 L195,0 L220,250 L182,250 Z" fill="url(#ribbonStripes)" />
            <path d="M240,0 L205,0 L178,250 L216,250 Z" fill="url(#ribbonStripes)" />
            <circle
              cx="199"
              cy="252"
              r="11"
              fill="url(#goldGrad)"
              stroke="#7a5a12"
              stroke-width="2"
            />

            <!-- Medal disc -->
            <circle cx="200" cy="410" r="160" fill="#9c7415" />
            <circle
              cx="200"
              cy="410"
              r="150"
              fill="url(#goldGrad)"
              stroke="#7a5a12"
              stroke-width="3"
            />
            <circle
              cx="200"
              cy="410"
              r="133"
              fill="none"
              stroke="#9c7415"
              stroke-width="2"
              opacity="0.5"
            />

            <!-- Ring of small stars -->
            <g fill="#c9971b">
              <use xlink:href="#starShape" transform="translate(200,292) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(259,307.8) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(302.2,351) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(318,410) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(302.2,469) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(259,512.2) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(200,528) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(141,512.2) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(97.8,469) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(82,410) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(97.8,351) scale(0.09)" />
              <use xlink:href="#starShape" transform="translate(141,307.8) scale(0.09)" />
            </g>

            <!-- Backdrop star -->
            <use
              xlink:href="#starShape"
              transform="translate(200,410) rotate(-8) scale(1.15)"
              fill="url(#starGrad)"
            />

            <!-- Torch -->
            <path d="M186,355 L214,355 L209,374 L191,374 Z" fill="#8a6a1a" />
            <rect x="197" y="374" width="6" height="24" fill="#8a6a1a" />
            <rect x="187" y="398" width="26" height="6" rx="2" fill="#8a6a1a" />
            <path
              d="M200,308 C211,323 215,334 205,347 C208,338 199,334 196,340 C190,329 189,318 200,308 Z"
              fill="#ffe98a"
              stroke="#c9971b"
              stroke-width="1"
            />

            <!-- Derby name is injected here, sized to fit -->
            <g id="svg-name-group"></g>
          </g>
        </svg>
      </div>
    </main>

    <div id="footer-trigger"><load src="./src/partials/footer.html" /></div>

    <script type="module" src="./src/js/site-core.js"></script>
    <script type="module" src="./src/js/derby.js"></script>
  </body>
</html>
